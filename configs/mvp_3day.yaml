# JANUS-FL -- 3-day MVP configuration (ROADMAP.md §0.1).
# This file is the single source of truth for every parameter the
# notebooks and fl/* code should read, rather than hardcoding numbers
# in multiple places that could silently drift apart.

protocol:
  n_clients: 50
  n_key_holders: 10          # n_c
  threshold: 7               # t, out of n_key_holders
  sampling_rate: 0.25        # p, VRF self-sampling
  epoch_rounds: 25           # R (p*R = 6.25 >= 5, satisfies the C9 constraint)
  k_min: 8                   # abort the round if fewer than this many accepted
  quant_bits: 16             # fixed-point mantissa for Quantize()

mvp_scope:
  rounds_per_run: 45         # cut from 120-150 (ROADMAP.md §0.1)
  n_seeds: 1                 # cut from 3
  models:
    - resnet18                # swapped from resnet50 2026-11-13: FL-benchmark convention, and
                               # ~47% of resnet50's model_dim -- see fl/models.py build_resnet18
                               # docstring and FIX.md. resnet50 kept as a later scalability ablation.
    - mobilenet_v2           # efficientnet_b0 intentionally dropped, see fl/models.py
  attacks:                   # cut from 7 to 5 (A2, A6 deferred -- compute-heavy, orthogonal to crypto claims)
    - a1_scaling
    - a3_sybil
    - a4_freeride
    - a5_splice
    - a7_collusion
  attacker_fractions: [0.1, 0.3]   # "2 fractions" per ROADMAP.md §0.1

local_training:
  # FIX.md F6: real FedAvg-style local training (McMahan et al. 2017),
  # not one full-batch gradient step repeated `local_epochs` times.
  # local_epochs = E, batch_size = B in the paper's notation; defaults
  # below follow the paper's non-IID FEMNIST-scale recommendation
  # (E=5 is within its tested E in {1,5,10,20}, B=20 matches its
  # smallest non-degenerate mini-batch setting) rather than its
  # largest-E/smallest-B extreme, since this repo's per-client shards
  # are themselves small (CASE1: 950/client; CASE2: ~4 writers/client,
  # min_samples_per_writer=120 each).
  lr: 0.01
  local_epochs: 5           # E
  batch_size: 20            # B
  momentum: 0.0             # plain SGD, matching the FedAvg paper's own default

sketch:
  m: 8192                    # JL sketch output dimension
  density: 0.3333333333333333  # 1/3, sparse JL

norm_rule:
  k: 3.0                     # B_t = median + k * 1.4826 * MAD
  ema_alpha: 0.3

evidence:
  alpha: 0.05                # certified false-accusation bound, Pr[open | honest] <= alpha
  n_permutations: 3000       # conformal calibration sample size

dp:
  sigma: 2.5                 # distributed Gaussian noise, aggregate sigma before per-client splitting
  delta: 1.0e-5

mixnet:
  n_hops: 3
  cell_size_bytes: 4096
  window_ms: [50, 500]       # per-hop forwarding delay range (simulate_batch_delay)

datasets:
  mnist:
    source: "csv"            # or "torchvision"
    csv_path: "/content/drive/MyDrive/FL-ZKP/data/mnist/train.csv"
    client_train_per_client: 950
    client_val_per_client: 100
    server_root: 5000
    global_val: 2500
  femnist:
    hf_dataset: "flwrlabs/femnist"
    cache_dir: "/content/drive/MyDrive/FL-ZKP/data/femnist_cache/"
    writers_per_client: 4
    client_writers: 200
    server_root_writers: 60
    global_val_writers: 40
    unseen_test_writers: 300
    min_samples_per_writer: 120
    local_val_fraction: 0.20

seed: 0

paths:
  repo_root: "/content/FL-ZKP"       # after unzipping the delivered zip on Colab
  drive_root: "/content/drive/MyDrive/FL-ZKP"
  results_dir: "/content/FL-ZKP/results"
